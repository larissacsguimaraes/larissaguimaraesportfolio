<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        /* Reset para eliminar margens e barras de rolagem horizontais indesejadas */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            overflow-x: hidden; 
        }
        
        /* Container estruturado para telas grandes */
        .container-da-pagina {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1920px; /* Trava de segurança para monitores Ultra-Wide (não distorce as imagens) */
            margin: 0 auto; /* Mantém o layout centralizado em telas gigantes */
        }

        /* Comportamento Fluido das Imagens */
        .container-da-pagina img {
            width: 100%; /* Expande a imagem para ocupar 100% da largura disponível */
            height: auto; /* Mantém a proporção original, evitando achatamento */
            display: block; /* Remove o espaço/quebra entre as fatias */
            margin: 0;
            padding: 0;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container-da-pagina">
        <img src="images/1.png" alt="Apresentação Parte 1">
        <img src="images/2.png" alt="Apresentação Parte 2">
        <img src="images/3.png" alt="Apresentação Parte 3">
        <img src="images/4.png" alt="Apresentação Parte 4">
        <img src="images/5.png" alt="Apresentação Parte 5">
        <img src="images/6.png" alt="Apresentação Parte 6">
        <img src="images/7.png" alt="Apresentação Parte 7">
        <img src="images/8.png" alt="Apresentação Parte 8">
        <img src="images/9.png" alt="Apresentação Parte 9">
        <img src="images/10.png" alt="Apresentação Parte 10">
    </div>

</body>
</html>
